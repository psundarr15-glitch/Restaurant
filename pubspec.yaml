name: restaurant_app
description: Restaurant manager app (Flutter client for the CodeIgniter API) - accept orders, manage menu, edit restaurant profile.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  intl: ^0.20.3
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Regenerated by CI on every build via:
#   dart run flutter_launcher_icons
# (see .github/workflows/build-apk.yml) since android/ is recreated fresh
# each run and doesn't keep generated mipmap icons between builds.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
